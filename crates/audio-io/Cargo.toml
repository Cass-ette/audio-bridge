[package]
name = "audio-bridge-io"
version = "0.1.0"
edition = "2021"

[dependencies]
audio-bridge-core = { path = "../core" }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
rand = "0.8"

[target.'cfg(windows)'.dependencies]
wasapi = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"

[dev-dependencies]
hound = "3.5"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[example]]
name = "sender"
path = "examples/sender.rs"

[[example]]
name = "receiver"
path = "examples/receiver.rs"

[[example]]
name = "loopback_sender"
path = "examples/loopback_sender.rs"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dev-dependencies]
tracing-subscriber = "0.3"
ctrlc = "3.4"
